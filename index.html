<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#061321" />
  <meta name="description" content="Guia de instalação PS5 da MCO GAMES — acompanhe o passo a passo para instalar seu jogo." />
  <title>MCO GAMES — Instalação PS5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#inicio" aria-label="MCO GAMES — início">
      <img src="assets/mco-logo-oficial.png" alt="MCO GAMES" />
    </a>
    <span class="header-caption">Instalação PS5</span>
    <button id="helpTop" class="header-help" type="button" aria-label="Abrir ajuda">Ajuda <span>?</span></button>
  </header>
  <main id="inicio">
    <section id="welcome" class="welcome" aria-labelledby="welcomeTitle">
      <div class="welcome-glow" aria-hidden="true"></div>
      <div class="welcome-content">
        <img class="welcome-logo" src="assets/mco-logo-oficial.png" alt="MCO GAMES" />
        <h1 id="welcomeTitle">Parabéns pela compra do <em id="gameWelcome">seu jogo</em>!</h1>
        <p>Siga o tutorial abaixo para concluir a instalação no seu PS5.</p>
        <button id="start" type="button" class="btn btn-primary btn-xl">Começar agora <span>→</span></button>
      </div>
      <div class="welcome-visual" aria-hidden="true">
        <div class="welcome-halo"></div><div class="ps5-illustration"><span class="ps-side left"></span><span class="ps-center"></span><span class="ps-side right"></span></div>
        <div class="visual-controller"><span>✚</span><span class="ctrl-center">⌂</span><span>✧</span></div>
      </div>
    </section>

    <section id="guide" class="guide hidden" aria-label="Tutorial de instalação">
      <div class="guide-heading">
        <div class="guide-identification">
          <span id="gameSubtitle">Seu jogo</span><span class="small-dot">·</span><span id="progressText">Etapa 1 de 21</span>
        </div>
        <div class="guide-actions">
          <button type="button" id="stepsToggle" class="icon-label-button" aria-expanded="false" aria-controls="stepSidebar">Etapas</button>
          <button type="button" id="pauseAuto" class="icon-label-button" aria-pressed="false">❚❚ Pausar</button>
          <button type="button" id="restart" class="icon-label-button restart-button" aria-label="Reiniciar tutorial">↻</button>
        </div>
      </div>
      <div class="progress-track" aria-label="Progresso do tutorial"><span id="progressFill"></span></div>
      <div class="guide-layout">
        <aside id="stepSidebar" class="step-sidebar" aria-label="Todas as etapas">
          <div class="side-title">Todas as etapas <button id="closeSteps" type="button" aria-label="Fechar etapas">✕</button></div>
          <nav id="stepNavigation" aria-label="Ir para uma etapa"></nav>
        </aside>
        <div id="sidebarShade" class="sidebar-shade hidden"></div>
        <section class="stage-col">
          <article class="screen-panel">
            <div class="scene-head">
              <h2 id="sceneTitle">Adicionar usuário</h2>
              <span id="sceneIndex" class="scene-index">1/21</span>
            </div>
            <p id="sceneLead" class="visually-hidden">Siga a orientação indicada.</p>
            <div class="screen-shell">
              <div id="sceneRoot" class="scene-root" role="img" aria-label="Representação orientativa da interface do PS5"></div>
              <button id="zoom" type="button" class="zoom-control" aria-label="Ampliar tela do PS5">⤢ Ampliar tela</button>
            </div>
            <div class="instruction-banner" aria-live="polite">
              <div class="instruction-icon" aria-hidden="true">➜</div>
              <div class="instruction-copy"><span id="actionCount">Indicação 1 de 1</span><strong id="actionText">Selecione a opção indicada.</strong></div>
              <span id="repeatCount" class="repeat-count" aria-label="Repetição atual">1/2</span>
            </div>
            <div id="extraOptions" class="extra-options"></div>
            <div id="warning" class="warning" role="note"></div>
            <div id="directions" class="directions hidden"></div>
            <div class="navigation-row">
              <button type="button" id="prevAction" class="small-action" title="Indicação anterior" aria-label="Indicação anterior">‹</button>
              <div class="action-dots" id="actionDots" aria-hidden="true"></div>
              <button type="button" id="nextAction" class="small-action" title="Próxima indicação" aria-label="Próxima indicação">›</button>
              <span class="nav-divider"></span>
              <button type="button" id="backStep" class="btn btn-secondary nav-step">← <span>Anterior</span></button>
              <button type="button" id="nextStep" class="btn btn-primary nav-step"><span>Próxima tela</span> →</button>
            </div>
          </article>
        </section>
      </div>
      <span id="progressPct" class="visually-hidden">0%</span>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel"><button id="modalClose" type="button" class="modal-close" aria-label="Fechar">✕</button><h2 id="modalTitle">Ajuda</h2><div id="modalContent"></div><button id="modalConfirm" type="button" class="btn btn-primary">Entendi</button></div>
  </div>
  <div id="zoomModal" class="zoom-modal hidden" role="dialog" aria-modal="true" aria-label="Tela do PS5 ampliada">
    <div class="zoom-bar"><strong>Tela do PS5</strong><button id="zoomClose" type="button" class="btn btn-secondary btn-small">Fechar ✕</button></div>
    <div id="zoomContent"></div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
